version: 1
name: basic license header comparison

fixtures:
  root: fixtures

skills:
  - path: ../../demo-skill/license-header

models:
  - default

variants:
  - name: with-skill
    kind: skill
    skill: license-header
  - name: no-skill
    kind: control
    controlOf: with-skill

security:
  sandbox: workspace-write
  network: false
  approval: never

runner:
  parallel: 1

report:
  resultsDir: results
