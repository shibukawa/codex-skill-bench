[project]
name = "codex-skill-bench"
version = "0.1.0"
description = "Run Codex skill benchmark suites against workspace fixtures."
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
dependencies = [
  "PyYAML>=6.0.2",
  "openai-codex>=0.1.0b2",
  "pytest>=8.0.0",
]

[project.scripts]
csb = "codex_skill_bench.cli:main"
eval = "codex_skill_bench.cli:eval_main"
init = "codex_skill_bench.cli:init_main"
add-fixture = "codex_skill_bench.cli:add_fixture_main"
list = "codex_skill_bench.cli:list_main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
