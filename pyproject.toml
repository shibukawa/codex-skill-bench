[project]
name = "codex-skill-bench"
version = "0.1.0"
description = "Run Codex skill benchmark suites against workspace fixtures."
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0.2",
  "openai-codex>=0.1.0b2",
  "pytest>=8.0.0",
]

[project.scripts]
codex-skill-bench = "codex_skill_bench.cli:main"
eval = "codex_skill_bench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
